spring:
  application:
    name: vrazumi-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vrazumi}
    username: ${DB_USER:vrazumi}
    password: ${DB_PASSWORD:vrazumi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    datatype:
      enum:
        # {"rating": 1} — ошибка 400, а не HARD по индексу
        fail-on-numbers-for-enums: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Без явного контекста Liquibase выполнил бы и демо-данные (context="demo").
    # Включить демо: LIQUIBASE_CONTEXTS=demo
    contexts: ${LIQUIBASE_CONTEXTS:default}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
