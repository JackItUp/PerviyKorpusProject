name: Backend Core CI

on:
  push:
    paths:
      - "backend/core/**"
      - ".github/workflows/backend-core-ci.yml"
  pull_request:
    paths:
      - "backend/core/**"
      - ".github/workflows/backend-core-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/core/pom.xml

      - name: Линтер (Spotless)
        run: ./mvnw -B spotless:check

      - name: Сборка и тесты (включая Testcontainers)
        run: ./mvnw -B verify

      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/core/target/surefire-reports
            backend/core/target/failsafe-reports
